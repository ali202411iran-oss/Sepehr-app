name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev automake
      
      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
      
      - name: Create buildozer.spec
        run: |
          yes | buildozer init
          sed -i 's/^title = .*/title = Sepehr/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = sepehr/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.sepehr/' buildozer.spec
          sed -i 's/^source.include_exts = .*/source.include_exts = py/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,colorama/' buildozer.spec
          sed -i 's/^android.permissions = .*/android.permissions = INTERNET/' buildozer.spec
          sed -i 's/^android.api = .*/android.api = 33/' buildozer.spec
          sed -i 's/^android.minapi = .*/android.minapi = 24/' buildozer.spec
          sed -i 's/^android.archs = .*/android.archs = arm64-v8a/' buildozer.spec
          cp sepehr_eng.py main.py
      
      - name: Build APK
        run: |
          buildozer android debug > buildozer_output.log 2>&1
        continue-on-error: true
        timeout-minutes: 120
      
      - name: Show log tail
        run: |
          echo "=== آخرین ۵۰ خط لاگ ==="
          tail -50 buildozer_output.log
      
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sepehr-apk
          path: bin/*.apk
      
      - name: Upload Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer_output.log
