name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-bullseye
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev automake
      
      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
      
      - name: Create buildozer.spec
        run: |
          yes | buildozer init
          sed -i 's/^title = .*/title = Sepehr/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = sepehr/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.sepehr/' buildozer.spec
          sed -i 's/^source.include_exts = .*/source.include_exts = py/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,colorama/' buildozer.spec
          sed -i 's/^android.permissions = .*/android.permissions = INTERNET/' buildozer.spec
          sed -i 's/^android.api = .*/android.api = 34/' buildozer.spec
          sed -i 's/^android.minapi = .*/android.minapi = 24/' buildozer.spec
          sed -i 's/^android.archs = .*/android.archs = arm64-v8a/' buildozer.spec
          cp sepehr_eng.py main.py
      
      - name: Build APK
        run: |
          yes | buildozer android debug
        timeout-minutes: 90
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sepehr-apk
          path: bin/*.apk
